name: Retrain wildfire model

on:
  push:
    paths:
      - "XGBoost_Model.py"
      - "final-datasets/Trihourly_Weather_Dataset.csv"
      - ".github/workflows/retrain-model.yml"

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost joblib

      - name: Retrain model
        run: python XGBoost_Model.py

      - name: Remove bulky evaluation predictions
        run: rm -f wildfire_predictions.csv

      - name: Commit retrained artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wildfire_model.pkl model_features.pkl backend/model/fire_model.pkl backend/model/features.json training_metrics.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: retrain wildfire model [model-training]"
          git push
